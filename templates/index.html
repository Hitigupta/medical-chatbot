<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Symptom Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h2 class="mb-4 text-center">Medical Symptom Checker</h2>
      <form action="/" method="post">
        <div class="form-group">
          <textarea class="form-control mb-3" name="user_input" rows="4" placeholder="Enter your symptoms..."></textarea>
          <button type="submit" class="btn btn-primary w-100">Check</button>
        </div>
      </form>
      {% if response %}
        <div class="mt-4 alert alert-info">{{ response }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
